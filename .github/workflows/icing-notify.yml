name: 노면 결빙 예측 카카오톡 알림

# 이 저장소의 기본 브랜치(main, GitHub Pages 배포용)에만 schedule/workflow_dispatch가
# 인식되므로 워크플로 정의는 main에 둔다. 실제 코드(scripts/icing-notify.js, js/icing.js,
# tests/ 등)는 master 브랜치에만 있고 main에는 복사하지 않는다 — 아래 checkout 단계에서
# ref: master로 그 코드를 그대로 받아와 실행한다.
#
# 실행은 외부 예약 서비스(cron-job.org)가 KST 16:30~익일 04:30 매시 30분(13회)
# GitHub API로 workflow_dispatch를 호출하는 방식이 기준이다(GitHub의 schedule은
# 혼잡 시 9~13시간까지도 지연된 전례가 있어 더 이상 실행 시각을 맡기지 않는다).
# 아래 두 schedule은 cron-job.org가 멈췄을 때의 보조 안전망으로만 남겨둔다 —
# 같은 시(hour)에 이미 실행된 기록이 있으면 스크립트 스스로 아무것도 하지 않고
# 끝나므로(중복 실행 방지), 둘이 겹쳐 돌아도 중복 발송은 없다.
on:
  schedule:
    - cron: '20 7 * * *'  # KST 16:20(보조)
    - cron: '50 11 * * *' # KST 20:50(보조)
  workflow_dispatch:
    inputs:
      source:
        description: "cron-job.org가 호출할 때 'cron'을 넣는다(사람이 Run workflow로 누르면 비워둠 — 수동 테스트로 처리됨)"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 수동/자동 판별 (schedule·cron-job.org 호출 = 자동, 사람이 Run workflow = 수동 테스트)
        id: ctx
        run: |
          IS_MANUAL=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.source }}" != "cron" ]; then
            IS_MANUAL=true
          fi
          echo "is_manual=$IS_MANUAL" >> "$GITHUB_OUTPUT"
          echo "트리거=${{ github.event_name }}, source입력=${{ github.event.inputs.source }}, 수동실행=$IS_MANUAL"

      - name: 판정 + 카카오톡 알림
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ICING_IS_MANUAL: ${{ steps.ctx.outputs.is_manual }}
        run: node scripts/icing-notify.js

      - name: 판정 기록·실황 캐시 커밋·push (master에만 — main에는 올리지 않음, 충돌 시 재시도)
        if: always()
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/icing-log/ data/obs-cache/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git commit -m "chore: 결빙 판정 결과·실황 캐시 자동 기록"
          for i in 1 2 3; do
            if git pull --rebase origin master && git push origin HEAD:master; then
              echo "push 성공(시도 $i/3)"
              exit 0
            fi
            echo "push 실패(시도 $i/3)"
            sleep 5
          done
          echo "::error::판정 기록 push 3회 재시도 후에도 실패 — 카카오 발송 결과와는 별개로 이 실행은 실패 처리합니다."
          node -e "require('./scripts/icing-notify.js').sendAnomalyAlertCli('기록 push 실패').catch(e => console.error(e))" || true
          exit 1
